# =============================================================
# APPLICATION 2 : API GATEWAY (Spring Cloud Gateway)
# =============================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: api-gateway
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/rouissinour464/Micro-service-api-Gateway.git
    targetRevision: v2     # tag Git stable pour la v2 du gateway
    path: k8s/app          # contient configmap.yml, deployment, service, kustomization.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: gestion-projet
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
 
 