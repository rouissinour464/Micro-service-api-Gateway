apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: api-gateway
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/rouissinour464/Micro-service-api-Gateway.git  # ← adapte l'URL
    targetRevision: HEAD
    path: k8s/app

  destination:
    server: https://kubernetes.default.svc
    namespace: gestion-projet

  syncPolicy:
    automated:
      prune: true        # supprime les ressources retirées du repo
      selfHeal: true     # re-synchronise si quelqu'un modifie le cluster manuellement
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m