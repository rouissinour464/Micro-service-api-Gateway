apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: stage-service
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/rouissinour464/-Micro-service-stage.git
    targetRevision: v1
    path: k8s/app
  destination:
    server: https://kubernetes.default.svc
    namespace: gestion-projet
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
  ignoreDifferences:
    - group: ""
      kind: PersistentVolumeClaim
      name: uploads-pvc
      jsonPointers:
        - /spec/storageClassName
    - group: ""
      kind: PersistentVolume
      name: uploads-pv
      jsonPointers:
        - /spec/storageClassName