apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: frontend-auth
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io

spec:
  project: default

  source:
    repoURL: https://github.com/rouissinour464/Micro-service-front.git
    targetRevision: v2
    path: k8s/app

  destination:
    server: https://kubernetes.default.svc
    namespace: gestion-projet

  syncPolicy:
    automated:
      prune: true
      selfHeal: false      # ← était true — Argo Rollouts gère l'état des pods
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true   # ← ajouter ceci
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m

  # Dire à ArgoCD d'ignorer les champs que Argo Rollouts modifie
  ignoreDifferences:
    - group: argoproj.io
      kind: Rollout
      jsonPointers:
        - /spec/replicas
        - /spec/template
        - /status
    - group: ""
      kind: Service
      jsonPointers:
        - /spec/selector