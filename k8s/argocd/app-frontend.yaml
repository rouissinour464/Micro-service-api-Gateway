apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: frontend-auth
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/rouissinour464/Micro-service-front.git
    targetRevision: v2
    path: k8s/app
  destination:
    server: https://kubernetes.default.svc
    namespace: gestion-projet
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m