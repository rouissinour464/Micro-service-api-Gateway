# =============================================================
# APPLICATION 3 : AUTH SERVICE (Spring Boot)
# =============================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: auth-service
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/rouissinour464/Micro-service-User.git
 
    # HEAD = dernier commit de la branche par défaut (main/master)
    # Différent des autres qui utilisent le tag "v2"
    # → chaque push sur la branche principale redéploie immédiatement
    # (moins stable que pointer un tag, mais pratique en développement)
    targetRevision: HEAD
 
    path: k8s/app
  destination:
    server: https://kubernetes.default.svc
    namespace: gestion-projet
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
 