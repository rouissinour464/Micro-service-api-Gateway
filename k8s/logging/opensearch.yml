---
# =============================================
# CONFIGMAP — OpenSearch
# =============================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: opensearch-config
  namespace: logging
data:
  opensearch.yml: |
    cluster.name: gestion-de-stage-logs
    network.host: 0.0.0.0
    discovery.type: single-node
    plugins.security.disabled: true
    bootstrap.memory_lock: false
    thread_pool.write.queue_size: 100
    thread_pool.search.queue_size: 100

---
# =============================================
# SERVICE — OpenSearch (interne cluster)
# =============================================
apiVersion: v1
kind: Service
metadata:
  name: opensearch
  namespace: logging
  labels:
    app: opensearch
spec:
  selector:
    app: opensearch
  ports:
    - name: http
      port: 9200
      targetPort: 9200
  type: ClusterIP

---
# =============================================
# POD UNIQUE — OpenSearch
# Volume data → PVC persistant 20Gi
# =============================================
apiVersion: v1
kind: Pod
metadata:
  name: opensearch
  namespace: logging
  labels:
    app: opensearch
spec:
  initContainers:
    - name: fix-vm-map
      image: busybox:1.35
      command: ["sysctl", "-w", "vm.max_map_count=262144"]
      securityContext:
        privileged: true

    # S'assurer que le dossier data appartient à l'user opensearch (uid 1000)
    - name: fix-permissions
      image: busybox:1.35
      command: ["chown", "-R", "1000:1000", "/usr/share/opensearch/data"]
      volumeMounts:
        - name: data
          mountPath: /usr/share/opensearch/data

  containers:
    - name: opensearch
      image: opensearchproject/opensearch:2.13.0
      ports:
        - containerPort: 9200
          name: http
      env:
        - name: OPENSEARCH_JAVA_OPTS
          value: "-Xms512m -Xmx512m"
        - name: DISABLE_SECURITY_PLUGIN
          value: "true"
        - name: discovery.type
          value: single-node
        - name: OPENSEARCH_USERNAME
          valueFrom:
            secretKeyRef:
              name: opensearch-credentials
              key: username
        - name: OPENSEARCH_PASSWORD
          valueFrom:
            secretKeyRef:
              name: opensearch-credentials
              key: password
      volumeMounts:
        - name: data
          mountPath: /usr/share/opensearch/data    # ← Données persistées sur PVC 20Gi
        - name: config
          mountPath: /usr/share/opensearch/config/opensearch.yml
          subPath: opensearch.yml
      resources:
        requests:
          memory: "768Mi"
          cpu: "250m"
        limits:
          memory: "1.2Gi"
          cpu: "500m"
      readinessProbe:
        httpGet:
          path: /_cluster/health
          port: 9200
        initialDelaySeconds: 45
        periodSeconds: 10
        failureThreshold: 6
      livenessProbe:
        httpGet:
          path: /_cluster/health
          port: 9200
        initialDelaySeconds: 90
        periodSeconds: 20

  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: pvc-opensearch-logs           # ← Branché sur PVC 20Gi
    - name: config
      configMap:
        name: opensearch-config

  restartPolicy: Always