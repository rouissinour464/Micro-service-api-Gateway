---
# =============================================
# RBAC — Fluent Bit
# =============================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluent-bit
  namespace: logging

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fluent-bit
rules:
  - apiGroups: [""]
    resources: [pods, namespaces, nodes]
    verbs: [get, list, watch]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fluent-bit
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fluent-bit
subjects:
  - kind: ServiceAccount
    name: fluent-bit
    namespace: logging

---
# =============================================
# CONFIGMAP — Fluent Bit
# Credentials lus depuis variables d'env
# (injectées via Secret opensearch-credentials)
# =============================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: logging
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush         5
        Daemon        Off
        Log_Level     warn
        Parsers_File  parsers.conf

    # ── INPUT : api-gateway ──
    [INPUT]
        Name              tail
        Tag               api-gateway
        Path              /var/log/containers/*micro-service-api-gateway*.log
        Parser            docker
        DB                /var/fluentbit-db/flb_api_gateway.db
        Mem_Buf_Limit     10MB
        Skip_Long_Lines   On
        Refresh_Interval  10

    # ── INPUT : micro-service-user ──
    [INPUT]
        Name              tail
        Tag               micro-service-user
        Path              /var/log/containers/*micro-service-user*.log
        Parser            docker
        DB                /var/fluentbit-db/flb_user.db
        Mem_Buf_Limit     10MB
        Skip_Long_Lines   On
        Refresh_Interval  10

    # ── FILTER : enrichir avec métadonnées K8s ──
    [FILTER]
        Name                kubernetes
        Match               *
        Kube_URL            https://kubernetes.default.svc:443
        Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
        Kube_Tag_Prefix     kube.var.log.containers.
        Merge_Log           On
        Merge_Log_Key       log_processed
        Labels              On
        Annotations         Off

    # ── OUTPUT : api-gateway → index dédié ──
    [OUTPUT]
        Name                opensearch
        Match               api-gateway
        Host                opensearch.logging.svc.cluster.local
        Port                9200
        Index               api-gateway-logs
        Logstash_Format     On
        Logstash_Prefix     api-gateway
        Logstash_DateFormat %Y.%m.%d
        HTTP_User           ${OPENSEARCH_USER}     # ← Injecté depuis le Secret
        HTTP_Passwd         ${OPENSEARCH_PASS}     # ← Injecté depuis le Secret
        tls                 Off
        Retry_Limit         3
        Suppress_Type_Name  On

    # ── OUTPUT : micro-service-user → index dédié ──
    [OUTPUT]
        Name                opensearch
        Match               micro-service-user
        Host                opensearch.logging.svc.cluster.local
        Port                9200
        Index               micro-service-user-logs
        Logstash_Format     On
        Logstash_Prefix     micro-service-user
        Logstash_DateFormat %Y.%m.%d
        HTTP_User           ${OPENSEARCH_USER}
        HTTP_Passwd         ${OPENSEARCH_PASS}
        tls                 Off
        Retry_Limit         3
        Suppress_Type_Name  On

  parsers.conf: |
    [PARSER]
        Name        docker
        Format      json
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L
        Time_Keep   On

    [PARSER]
        Name        spring-json
        Format      json
        Time_Key    timestamp
        Time_Format %Y-%m-%dT%H:%M:%S.%LZ
        Time_Keep   On

---
# =============================================
# DAEMONSET — Fluent Bit
# spec.selector fixé : app: fluent-bit UNIQUEMENT
# (kustomize labels n'injecte plus dedans)
# =============================================
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit
  namespace: logging
  labels:
    app: fluent-bit
spec:
  selector:
    matchLabels:
      app: fluent-bit          # ← Sélecteur minimal, immuable, ne sera plus modifié
  template:
    metadata:
      labels:
        app: fluent-bit
    spec:
      serviceAccountName: fluent-bit
      tolerations:
        - key: node-role.kubernetes.io/master
          effect: NoSchedule
        - key: node-role.kubernetes.io/control-plane
          effect: NoSchedule
      containers:
        - name: fluent-bit
          image: fluent/fluent-bit:3.0
          env:
            - name: OPENSEARCH_USER         # ← Variable injectée depuis le Secret
              valueFrom:
                secretKeyRef:
                  name: opensearch-credentials
                  key: username
            - name: OPENSEARCH_PASS         # ← Variable injectée depuis le Secret
              valueFrom:
                secretKeyRef:
                  name: opensearch-credentials
                  key: password
          volumeMounts:
            - name: varlog
              mountPath: /var/log
            - name: containers
              mountPath: /var/lib/docker/containers
              readOnly: true
            - name: config
              mountPath: /fluent-bit/etc/
            - name: fluentbit-db
              mountPath: /var/fluentbit-db
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "64Mi"
              cpu: "50m"
      volumes:
        - name: varlog
          hostPath:
            path: /var/log
        - name: containers
          hostPath:
            path: /var/lib/docker/containers
        - name: config
          configMap:
            name: fluent-bit-config
        - name: fluentbit-db
          persistentVolumeClaim:
            claimName: pvc-fluentbit-db
      terminationGracePeriodSeconds: 10