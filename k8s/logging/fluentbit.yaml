---
# ============================================================
# SERVICE ACCOUNT
# ============================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluent-bit
  namespace: logging

---
# ============================================================
# CLUSTER ROLE — lecture pods/namespaces/nodes
# ============================================================
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fluent-bit
rules:
  - apiGroups: [""]
    resources: [pods, namespaces, nodes]
    verbs: [get, list, watch]

---
# ============================================================
# CLUSTER ROLE BINDING
# ============================================================
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fluent-bit
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fluent-bit
subjects:
  - kind: ServiceAccount
    name: fluent-bit
    namespace: logging

---
# ============================================================
# CONFIG MAP — Fluent Bit
# ============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: logging
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush             5
        Daemon            Off
        Log_Level         info
        Parsers_File      parsers.conf
        # Buffer HTTP interne : évite l'OOM en cas de burst
        HTTP_Server       Off
        storage.path      /var/fluentbit-db/storage
        storage.sync      normal
        storage.checksum  off
        # Limite buffer mémoire globale
        storage.max_chunks_up 128

    # ──────────────────────────────────────────
    # INPUT : tous les logs containers
    # ──────────────────────────────────────────
    [INPUT]
        Name              tail
        Tag               kube.*
        Path              /var/log/containers/*.log
        Parser            docker
        DB                /var/fluentbit-db/flb.db
        Mem_Buf_Limit     20MB
        Skip_Long_Lines   On
        Refresh_Interval  5
        # Ignore les logs du namespace logging lui-même
        # pour éviter la boucle Fluent Bit → OpenSearch → Fluent Bit
        Exclude_Path      /var/log/containers/*logging*.log

    # ──────────────────────────────────────────
    # FILTER : enrichissement métadonnées K8s
    # ──────────────────────────────────────────
    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_URL            https://kubernetes.default.svc:443
        Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
        Merge_Log           On
        Merge_Log_Key       log_processed
        Keep_Log            Off
        Labels              On
        Annotations         Off

    # ──────────────────────────────────────────
    # OUTPUT : OpenSearch
    # ──────────────────────────────────────────
    [OUTPUT]
        Name                opensearch
        Match               *
        Host                opensearch.logging.svc.cluster.local
        Port                9200
        Index               k8s-logs
        Logstash_Format     On
        Logstash_Prefix     k8s
        Logstash_DateFormat %Y.%m.%d
        # ← Corrigé : pas d'auth car sécurité OpenSearch désactivée
        # Si tu réactives la sécurité, décommente :
        # HTTP_User         ${OPENSEARCH_USER}
        # HTTP_Passwd       ${OPENSEARCH_PASS}
        tls                 Off
        # ← Corrigé : Retry_Limit borné pour éviter l'OOM
        #   False = infini → dangereux avec 128Mi de limite mémoire
        Retry_Limit         5
        Suppress_Type_Name  On
        # Buffer filesystem pour survivre aux redémarrages OpenSearch
        storage.type        filesystem

  parsers.conf: |
    [PARSER]
        Name        docker
        Format      json
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L
        Time_Keep   On

    [PARSER]
        Name        cri
        Format      regex
        Regex       ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[^ ]*) (?<log>.*)$
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L%z
        Time_Keep   On

---
# ============================================================
# DAEMONSET — Fluent Bit
# ============================================================
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit
  namespace: logging
  labels:
    app: fluent-bit
spec:
  selector:
    matchLabels:
      app: fluent-bit
  template:
    metadata:
      labels:
        app: fluent-bit
    spec:
      serviceAccountName: fluent-bit

      # Tolère tous les taints → capture les logs sur chaque nœud
      # y compris control-plane
      tolerations:
        - operator: Exists

      containers:
        - name: fluent-bit
          image: fluent/fluent-bit:3.0
          env:
            # Variables présentes mais non utilisées tant que sécurité
            # OpenSearch est désactivée — prêtes pour la prod
            - name: OPENSEARCH_USER
              valueFrom:
                secretKeyRef:
                  name: opensearch-credentials
                  key: username
            - name: OPENSEARCH_PASS
              valueFrom:
                secretKeyRef:
                  name: opensearch-credentials
                  key: password

          volumeMounts:
            - name: varlog
              mountPath: /var/log
            - name: containers
              mountPath: /var/lib/docker/containers
              readOnly: true
            - name: config
              mountPath: /fluent-bit/etc/
            - name: fluentbit-db
              mountPath: /var/fluentbit-db

          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              # Suffisant avec Retry_Limit 5 et storage filesystem
              memory: "128Mi"
              cpu: "100m"

      volumes:
        - name: varlog
          hostPath:
            path: /var/log

        - name: containers
          hostPath:
            path: /var/lib/docker/containers

        - name: config
          configMap:
            name: fluent-bit-config

        - name: fluentbit-db
          persistentVolumeClaim:
            claimName: pvc-fluentbit-db

      terminationGracePeriodSeconds: 10