apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: logging

resources:
  - namespace-logging.yaml
  - pv-pvc.yaml
  - opensearch.yaml
  - dashboards.yaml
  - fluentbit.yaml

# ← Remplace commonLabels (déprécié + modifie les sélecteurs)
labels:
  - pairs:
      project: gestion-de-stage
      component: logging
      managed-by: kustomize
    includeSelectors: false   # ← Ne touche pas spec.selector (champ immuable)
    includeTemplates: true    # ← Applique aux pod templates