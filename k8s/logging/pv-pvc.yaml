---
# ============================================================
# STORAGE CLASS
# ============================================================
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: logging-local
provisioner: kubernetes.io/no-provisioner
# Immediate : évite le deadlock WaitForFirstConsumer avec hostPath
volumeBindingMode: Immediate
reclaimPolicy: Retain

---
# ============================================================
# PV — OpenSearch Logs (20Gi)
# ============================================================
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-opensearch-logs
  labels:
    # Label explicite pour le selector du PVC → binding déterministe
    volume-for: opensearch-logs
    app: opensearch
    type: logging
spec:
  storageClassName: logging-local
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /data/opensearch-logs
    type: DirectoryOrCreate
  # Affinité sur le nœud worker principal
  # Remplace <WORKER_NODE_NAME> par le nom réel : kubectl get nodes
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: Exists   # ← à remplacer par In + valeur en prod

---
# ============================================================
# PVC — OpenSearch Logs
# ============================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-opensearch-logs
  namespace: logging
  labels:
    app: opensearch
spec:
  storageClassName: logging-local
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  # Selector explicite → garantit le binding sur le bon PV
  selector:
    matchLabels:
      volume-for: opensearch-logs

---
# ============================================================
# PV — OpenSearch Dashboards (2Gi)
# ============================================================
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-opensearch-dashboards
  labels:
    volume-for: opensearch-dashboards
    app: opensearch-dashboards
    type: logging
spec:
  storageClassName: logging-local
  capacity:
    storage: 2Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /data/opensearch-dashboards
    type: DirectoryOrCreate
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: Exists

---
# ============================================================
# PVC — OpenSearch Dashboards
# ============================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-opensearch-dashboards
  namespace: logging
  labels:
    app: opensearch-dashboards
spec:
  storageClassName: logging-local
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  selector:
    matchLabels:
      volume-for: opensearch-dashboards

---
# ============================================================
# PV — Fluent Bit DB (1Gi)
# ============================================================
