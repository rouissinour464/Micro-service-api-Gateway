---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: logging-local
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: Immediate        # ← Corrigé : WaitForFirstConsumer causait le deadlock
reclaimPolicy: Retain

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-opensearch-logs
  labels:
    app: opensearch
    type: logging
spec:
  storageClassName: logging-local
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /data/opensearch-logs
    type: DirectoryOrCreate
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: Exists

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-opensearch-logs
  namespace: logging
  labels:
    app: opensearch
spec:
  storageClassName: logging-local
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  # ← selector supprimé : incompatible avec WaitForFirstConsumer
  #   et inutile car le storageClassName suffit à cibler le bon PV

