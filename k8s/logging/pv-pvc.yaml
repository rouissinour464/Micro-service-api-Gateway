    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /data/fluentbit-db
    type: DirectoryOrCreate
  # ← Corrigé : nodeAffinity manquante dans la version originale
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: Exists

---
# ============================================================
# PVC — Fluent Bit DB
# ============================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-fluentbit-db
  namespace: logging
  labels:
