---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboards-config
  namespace: logging
data:
  opensearch_dashboards.yml: |
    server.name: opensearch-dashboards
    server.host: "0.0.0.0"
    opensearch.hosts: ["http://opensearch.logging.svc.cluster.local:9200"]
---
apiVersion: v1
kind: Service
metadata:
  name: opensearch-dashboards
  namespace: logging
  labels:
    app: opensearch-dashboards
spec:
  selector:
    app: opensearch-dashboards
  ports:
    - name: http
      port: 5601
      targetPort: 5601
      nodePort: 30601
  type: NodePort

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opensearch-dashboards
  namespace: logging
  labels:
    app: opensearch-dashboards

spec:
  replicas: 1
  progressDeadlineSeconds: 600

  selector:
    matchLabels:
      app: opensearch-dashboards

  template:
    metadata:
      labels:
        app: opensearch-dashboards

    spec:

      initContainers:
        - name: fix-permissions
          image: busybox:1.35
          command:
            - sh
            - -c
            - chown -R 1000:1000 /usr/share/opensearch-dashboards/data
          volumeMounts:
            - name: dashboards-storage
              mountPath: /usr/share/opensearch-dashboards/data

      containers:
        - name: dashboards
          image: opensearchproject/opensearch-dashboards:2.13.0

          ports:
            - containerPort: 5601

          env:
            - name: OPENSEARCH_HOSTS
              value: '["http://opensearch.logging.svc.cluster.local:9200"]'

            - name: DISABLE_SECURITY_DASHBOARDS_PLUGIN
              value: "true"

            - name: NODE_OPTIONS
              value: "--max-old-space-size=512"

          volumeMounts:
            - name: dashboards-storage
              mountPath: /usr/share/opensearch-dashboards/data

            # ✅ FIX IMPORTANT : mount dossier complet config
            - name: config
              mountPath: /usr/share/opensearch-dashboards/config/

          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "250m"

          readinessProbe:
            httpGet:
              path: /api/status
              port: 5601
            initialDelaySeconds: 90
            periodSeconds: 15
            failureThreshold: 8

          livenessProbe:
            httpGet:
              path: /api/status
              port: 5601
            initialDelaySeconds: 120
            periodSeconds: 20
            failureThreshold: 5

      volumes:
        - name: dashboards-storage
          persistentVolumeClaim:
            claimName: pvc-opensearch-dashboards

        - name: config
          configMap:
            name: dashboards-config