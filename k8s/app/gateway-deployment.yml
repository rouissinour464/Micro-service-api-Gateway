apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  namespace: gestion-projet
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway-service
  template:
    metadata:
      labels:
        app: gateway-service
    spec:
      containers:
        - name: gateway
          image: nour292/api-gateway:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
